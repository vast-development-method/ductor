[defaults]
host_key_checking = True
retry_files_enabled = False
interpreter_python = /usr/bin/python3
inject_facts_as_vars = False
display_args_to_stdout = False
nocows = True
timeout = 30
forks = 10

[ssh_connection]
pipelining = True
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o BatchMode=yes -o StrictHostKeyChecking=yes

[privilege_escalation]
become_method = sudo
