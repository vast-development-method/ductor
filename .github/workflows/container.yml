name: Ductor distribution

on:
  pull_request:
  push:
    branches: [main, 'feature/**']
    tags: ['v2.*']

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    name: Validate controller and standalone installer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install controller dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv shellcheck
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install -r requirements-controller.txt
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"
      - name: Run the offline controller suite
        run: bash tests/run.sh
      - name: Validate distribution shell
        run: shellcheck install.sh src/ductor
      - name: Exercise the real standalone installer
        shell: bash
        run: |
          set -Eeuo pipefail
          version=$(cat VERSION)
          archive="$RUNNER_TEMP/ductor-$version.tar.gz"
          git archive --format=tar.gz --prefix="ductor-$version/" HEAD > "$archive"
          sha=$(sha256sum "$archive")
          bash install.sh --version "$version" --bundle "$archive" --sha256 "${sha%% *}" \
            --prefix "$RUNNER_TEMP/ductor-install" --bin-dir "$RUNNER_TEMP/ductor-bin"
          test "$("$RUNNER_TEMP/ductor-bin/ductor" --version)" = "$version"
          "$RUNNER_TEMP/ductor-bin/ductor" --help
          test ! -e "$RUNNER_TEMP/ductor-install/current/.git"

  image:
    name: Build and exercise ${{ matrix.arch }} controller
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/vast-development-method/ductor
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate the release identity
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          version=$(cat VERSION)
          [[ $version =~ ^2\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          if [[ $REF_TYPE == tag ]]; then
            [[ $REF_NAME == "v$version" ]] || { echo 'Tag must match VERSION.' >&2; exit 1; }
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Build the native image
        env:
          VERSION: ${{ steps.release.outputs.version }}
          REVISION: ${{ github.sha }}
        run: |
          docker build --pull --build-arg "DUCTOR_VERSION=$VERSION" \
            --build-arg "VCS_REF=$REVISION" --build-arg "BUILD_DATE=$(date -u +%FT%TZ)" \
            --tag ductor:ci .
      - name: Exercise the controller without daemon access
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          options=(--rm --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp:rw,nosuid,nodev,size=128m)
          test "$(docker run "${options[@]}" ductor:ci --version)" = "$VERSION"
          docker run "${options[@]}" ductor:ci --help
          docker run "${options[@]}" --entrypoint /bin/sh ductor:ci -ec 'test ! -e /var/run/docker.sock; ! command -v docker; ! command -v incus; ! command -v sshd; ansible-playbook --version'
          mkdir -p "$RUNNER_TEMP/state" "$RUNNER_TEMP/inputs"
          DUCTOR_STATE_PATH="$RUNNER_TEMP/state" DUCTOR_INPUTS_PATH="$RUNNER_TEMP/inputs" \
            docker compose -f compose.ductor.yaml config --quiet
      - name: Publish the tested architecture on an explicit release tag
        if: github.repository == 'vast-development-method/ductor' && github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          ARCH: ${{ matrix.arch }}
          REVISION: ${{ github.sha }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker tag ductor:ci "$IMAGE:sha-$REVISION-$ARCH"
          docker push "$IMAGE:sha-$REVISION-$ARCH"

  release:
    name: Publish versioned image and standalone bundle
    needs: image
    if: github.repository == 'vast-development-method/ductor' && github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/vast-development-method/ductor
      VERSION: ${{ needs.image.outputs.version }}
      REVISION: ${{ github.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Publish the tested multi-architecture manifest
        env:
          GHCR_USER: ${{ github.actor }}
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:sha-$REVISION" \
            "$IMAGE:sha-$REVISION-amd64" "$IMAGE:sha-$REVISION-arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
      - name: Publish the immutable standalone release bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="ductor-$VERSION.tar.gz"
          git archive --format=tar.gz --prefix="ductor-$VERSION/" HEAD > "$archive"
          sha256sum "$archive" > "$archive.sha256"
          prerelease=()
          if [[ $VERSION == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "v$VERSION" --verify-tag --title "Ductor $VERSION" \
            --generate-notes "${prerelease[@]}" "$archive" "$archive.sha256" install.sh
          printf 'Published `%s:%s` for Linux amd64/arm64 and the checksum-verified standalone bundle.\n' "$IMAGE" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
