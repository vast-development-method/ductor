name: Ductor tests
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
permissions:
  contents: read
jobs:
  bash:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq openssl openssh-client ripgrep
      - name: Validate the single-script runtime
        run: sudo env "PATH=$PATH" bash tests/run.sh
