name: ductor-controller
services:
  ductor:
    image: ${DUCTOR_IMAGE:-ghcr.io/vast-development-method/ductor:2.0.0-rc.1}
    user: "${DUCTOR_UID:-0}:${DUCTOR_GID:-0}"
    # Run interactively: docker compose -f compose.ductor.yaml run --rm ductor
    # It is an operations tool, not an always-running scheduler or gateway.
    command: [menu]
    stdin_open: true
    tty: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DUCTOR_CONTAINER: '1'
      DUCTOR_STATE_DIR: /var/lib/ductor
      DUCTOR_CONFIG: /var/lib/ductor/config.json
      HOME: /var/lib/ductor
    volumes:
      - type: bind
        source: ${DUCTOR_STATE_PATH:?Set an existing absolute private controller state directory}
        target: /var/lib/ductor
        bind:
          create_host_path: false
      - type: bind
        source: ${DUCTOR_INPUTS_PATH:?Set an existing absolute private SSH and credential input directory}
        target: /run/ductor-inputs
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m,mode=1777
    pids_limit: 256
    mem_limit: ${DUCTOR_CONTROLLER_MEMORY:-512m}
    cpus: ${DUCTOR_CONTROLLER_CPUS:-1.0}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
