name: ductor-controller
services:
  ductor:
    image: ${DUCTOR_IMAGE:-ghcr.io/vast-development-method/ductor:0.1.0-rc.1}
    restart: unless-stopped
    command: [serve]
    # Linux Docker Engine: sibling service loopback endpoints remain reachable.
    # Broker listens directly on DUCTOR_BROKER_PORT; do not add ports: here.
    network_mode: host
    environment:
      DUCTOR_CONTAINER: "1"
      DUCTOR_STATE_DIR: /var/lib/ductor
      INCUS_CONF: /var/lib/ductor/incus
      DUCTOR_BROKER_LISTEN_ADDRESS: ${DUCTOR_BROKER_LISTEN_ADDRESS:-0.0.0.0}
      DUCTOR_BROKER_PORT: ${DUCTOR_BROKER_PORT:-2222}
      DUCTOR_REAPER_INTERVAL: ${DUCTOR_REAPER_INTERVAL:-30}
    volumes:
      # The SAME absolute path must exist on the daemon host and in this
      # container: generated sibling service Compose files bind files below it.
      - type: bind
        source: /var/lib/ductor
        target: /var/lib/ductor
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
    stop_grace_period: 45s
    pids_limit: 256
    mem_limit: ${DUCTOR_CONTROLLER_MEMORY:-512m}
    cpus: ${DUCTOR_CONTROLLER_CPUS:-1.0}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
